<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 临时占位符Logo - 等待替换为正式Logo -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" />
  
  <!-- 无线电波纹效果 -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3" />
  <circle cx="100" cy="100" r="55" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5" />
  <circle cx="100" cy="100" r="40" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7" />
  
  <!-- 中心天线图标 -->
  <g transform="translate(100, 100)">
    <!-- 天线主体 -->
    <rect x="-3" y="-35" width="6" height="70" fill="#FFFFFF" rx="2" />
    
    <!-- 天线顶部 -->
    <circle cx="0" cy="-35" r="8" fill="#DC2626" />
    
    <!-- 信号波 - 左侧 -->
    <path d="M -25,-15 Q -35,-15 -35,-5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M -35,-5 Q -35,5 -25,5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    
    <!-- 信号波 - 右侧 -->
    <path d="M 25,-15 Q 35,-15 35,-5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M 35,-5 Q 35,5 25,5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <!-- 文字标识 -->
  <text x="100" y="170" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    无线电监测
  </text>
</svg>

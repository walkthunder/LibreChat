<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="theme-color" content="#1E3A8A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="无线随申查（开放版） - 上海市无线电监测站智能工作助手，提供无线电监测、干扰查找、设备检测、频谱分析等专业服务" />
    <meta name="keywords" content="无线电监测,频谱分析,干扰查找,设备检测,上海市无线电监测站" />
    <title>无线随申查（开放版）</title>
    <link rel="icon" type="image/svg+xml" href="assets/radio-monitoring-favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/radio-monitoring-favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/radio-monitoring-favicon-16x16.png" />
    <link rel="apple-touch-icon" href="assets/radio-monitoring-apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
    </style>
    <script>
      const theme = localStorage.getItem('color-theme');
      const loadingContainerStyle = document.createElement('style');
      let backgroundColor;

      if (theme === 'dark') {
        backgroundColor = '#0d0d0d';
      } else if (theme === 'light') {
        backgroundColor = '#ffffff';
      } else if (theme === 'system') {
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
        backgroundColor = prefersDarkScheme ? '#0d0d0d' : '#ffffff';
      } else {
        backgroundColor = '#ffffff';
      }

      loadingContainerStyle.innerHTML = `
        #loading-container {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: ${backgroundColor};
        }
      `;
      document.head.appendChild(loadingContainerStyle);
    </script>
    <script defer type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root">
      <div id="loading-container"></div>
    </div>
  </body>
</html>

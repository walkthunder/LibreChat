fileConfig:
  endpoints:
    # DeepSeek endpoint - MUST match endpoint name exactly (case-sensitive)
    # Files will be processed as text context via RAG API
    Deepseek:
      disabled: false
      fileLimit: 10
      fileSizeLimit: 20
      totalSizeLimit: 50
      supportedMimeTypes:
        - "application/pdf"
        - "text/.*"
        - "application/vnd.openxmlformats-officedocument.*"
        - "application/msword"
        - "application/vnd.ms-excel"
        - "application/vnd.ms-powerpoint"
    default:
      totalSizeLimit: 50
      fileSizeLimit: 20
  serverFileSizeLimit: 100
  avatarSizeLimit: 2
#   imageGeneration: # Image Gen settings, either percentage or px
#     percentage: 100
#     px: 1024
#   # Client-side image resizing to prevent upload errors
